<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="초능력 아이의 보호자가 되어 여섯 달 동안 가르침으로 신념을 키우는 도트 육성 게임 프로토타입" />
    <meta name="theme-color" content="#f6f2e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1b2c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <title>히어로의 씨앗</title>
    <style>#boot{color:#1d1b2c;text-align:center;background:#f6f2e6;place-items:center;padding:16px;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;display:grid;position:fixed;top:0;bottom:0;left:0;right:0}@media (prefers-color-scheme:dark){#boot{color:#f6f2e6;background:#1d1b2c}}#boot .dots:after{content:"…";animation:1s steps(2,end) infinite blink}@keyframes blink{50%{opacity:.2}}#boot button{font:inherit;min-height:44px;color:inherit;cursor:pointer;background:0 0;border:2px solid;border-radius:10px;margin-top:12px;padding:0 20px}</style>
    <script type="module" crossorigin src="./assets/index-DpwT4yOr.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-BSBLrfai.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CYt_DB2J.css">
  </head>
  <body>
    <div id="boot" role="status">
      <div>
        <p class="boot-msg">히어로의 씨앗을 불러오는 중<span class="dots"></span></p>
        <div class="boot-fail" hidden>
          <p>게임을 불러오지 못했습니다. 네트워크 상태를 확인한 뒤 다시 시도해 주세요.</p>
          <button type="button" onclick="location.reload()">다시 시도</button>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        function fail() {
          if (document.documentElement.dataset.ready) return;
          var b = document.getElementById('boot');
          if (!b) return;
          b.querySelector('.boot-msg').hidden = true;
          b.querySelector('.boot-fail').hidden = false;
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) fail();
        }, true);
        setTimeout(fail, 20000);
      })();
    </script>
  </body>
</html>
